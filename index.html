<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>زخرف — معرض اللوحات</title>
<meta name="description" content="زخرف — معرض لوحات تمشي فيه. اختر لوحتك واطلبها مباشرة.">
<link rel="icon" href="logo-sm.webp">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
/* VOICE: هادئ وأنيق، صالة عرض بيضاء
   IDEA: ممر معرض فني تمشي فيه بالسكرول، والكاميرا تلتفت للوحة عند اختيارها
   PICTURE: الممر ثلاثي الأبعاد بجدارين عليهما اللوحات، والشعار في البداية والنهاية
   COLOUR and TYPE: أبيض، حبر أسود، أخضر وذهبي الشعار للأزرار والتفاصيل. Reem Kufi + IBM Plex Sans Arabic
   LAYOUT: مسرح ثابت، شريط علوي، شريط سفلي، لوحة بيانات جانبية (سفلية على الموبايل) */
:root{color-scheme:light;--bg:#fbfbf9;--ink:#161513;--mute:#716c64;--line:#e5e2dc;--card:#fff;--green:#3e5642;--gold:#a87b45}
*{box-sizing:border-box;min-width:0}
html.lenis,html.lenis body{height:auto}
.lenis.lenis-smooth{scroll-behavior:auto!important}
.lenis.lenis-stopped{overflow:hidden}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans Arabic",system-ui,sans-serif;overflow-x:clip}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,.art:focus-visible{outline:2px solid var(--green);outline-offset:3px}

#stage{position:fixed;inset:0;overflow:hidden;perspective:var(--p,900px);background:var(--bg)}
#world{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.pl{position:absolute;left:0;top:0;backface-visibility:hidden}
.wl{background:#f4f3ef}.wr{background:#f8f7f4}
.fl{background:#e9e7e2}.ce{background:#f7f6f3}
.bb{background:#d6d2ca}
#corr{position:absolute;left:50%;top:50%;overflow:visible;will-change:transform}
#world:not(.walls) :is(.wl,.wr,.fl,.ce,.bb,.lt,.fs){display:none}.lt{background:#fff}.fs{background:#efeee9}
.end{display:grid;place-items:center;align-content:center;gap:22px;text-align:center;background:radial-gradient(ellipse at 50% 35%,#fff,#f4f2ee 75%)}
.end img{height:46%;width:auto;box-shadow:0 30px 60px rgba(30,25,20,.2)}
.end span{color:var(--mute);font-size:22px}

.art{cursor:pointer;outline:none}
.art .frame{position:absolute;inset:0;border:var(--fw,10px) solid var(--fc,#1d1b19);background:#fff;padding:7%;box-shadow:0 10px 22px rgba(30,25,20,.2);transition:transform .4s}
.art:hover .frame{transform:scale(1.025)}
.art svg{display:block;width:100%;height:100%}
.art::after{content:"";position:absolute;top:-34px;left:32%;right:32%;height:7px;border-radius:4px;background:#2a2826;}
.plaque{position:absolute;top:calc(100% + 22px);right:0;background:#fff;padding:7px 12px;font-size:15px;line-height:1.35;box-shadow:0 2px 6px rgba(0,0,0,.08);white-space:nowrap}
.plaque small{display:block;color:var(--mute);font-size:13px}

header{position:fixed;inset:0 0 auto;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px max(4vw,16px);background:linear-gradient(var(--bg) 45%,rgba(251,251,249,0));transition:opacity .4s}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--ink)}
.brand img{height:50px;width:auto;display:block}
.brand b{font:700 26px/1 "Reem Kufi",sans-serif;display:block}
.brand small{display:block;color:var(--mute);font-size:13px;margin-top:3px}
.btn{min-height:44px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--card);font-size:15px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn.dark{background:var(--green);color:#fff;border-color:var(--green)}
.btn:hover{border-color:var(--ink)}.btn.dark:hover{background:#334a37}

#hero{position:fixed;inset:0;z-index:3;display:grid;place-items:center;align-content:center;text-align:center;padding:90px 24px 110px;pointer-events:none;background:radial-gradient(ellipse 46% 52% at 50% 50%,rgba(251,251,249,.94) 35%,rgba(251,251,249,0) 100%)}
#hero img{height:clamp(170px,30vh,290px);width:auto;box-shadow:0 26px 60px rgba(30,25,20,.22)}
#hero p{margin:22px 0 0;font-size:clamp(17px,2vw,21px);color:#3a3732;max-width:32ch}
.cue{margin-top:26px;display:grid;justify-items:center;gap:12px;pointer-events:auto}
.cue strong{font-size:18px;font-weight:600}
.cue small{color:var(--mute);font-size:14px}
.mouse{width:28px;height:44px;border:2px solid var(--ink);border-radius:16px;position:relative}
.mouse::after{content:"";position:absolute;left:50%;top:8px;width:4px;height:8px;margin-left:-2px;border-radius:2px;background:var(--green);animation:wheel 1.6s ease-in-out infinite}
.touch .mouse{border-radius:8px;width:30px;height:46px}
.touch .mouse::after{width:10px;height:10px;margin-left:-5px;border-radius:50%;top:auto;bottom:6px;animation:swipe 1.6s ease-in-out infinite}
@keyframes wheel{0%{transform:translateY(0);opacity:1}70%{transform:translateY(14px);opacity:0}100%{opacity:0}}
@keyframes swipe{0%{transform:translateY(0);opacity:1}70%{transform:translateY(-22px);opacity:0}100%{opacity:0}}
.cue.nudge{animation:nudge 1.2s ease-in-out 2}
@keyframes nudge{50%{transform:translateY(10px)}}

#bar{position:fixed;inset:auto 0 0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px max(4vw,16px) 20px;background:linear-gradient(rgba(251,251,249,0),var(--bg) 55%);transition:opacity .4s,transform .4s}
#cap{flex:1;display:flex;justify-content:center;gap:clamp(12px,4vw,48px);font-size:16px;text-align:center}
#cap button{background:none;border:0;padding:6px 4px;min-height:44px;border-bottom:1px solid transparent}
#cap button:hover{border-color:var(--ink)}
#cap small{display:block;color:var(--mute);font-size:13px}
#prog{position:fixed;inset:auto 0 0;height:3px;z-index:6;background:var(--green);transform-origin:right;transform:scaleX(0)}
#outro{position:fixed;inset:auto 0 110px;z-index:4;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;opacity:0;pointer-events:none;transition:opacity .5s}
#outro.on{opacity:1;pointer-events:auto}
#toast{position:fixed;top:84px;left:50%;z-index:6;transform:translate(-50%,-10px);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .4s,transform .4s;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
.note{position:fixed;left:max(4vw,16px);top:80px;z-index:5;font-size:13px;color:var(--mute)}

body.focus header,body.focus #bar,body.focus .note,body.focus #outro{opacity:0;pointer-events:none}
body.focus #bar{transform:translateY(20px)}
body.focus #hero,body.focus #toast{visibility:hidden}
#panel{position:fixed;z-index:7;left:max(4vw,16px);top:50%;width:min(400px,36vw);transform:translateY(-50%);background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:18px;padding:26px 26px 22px;box-shadow:0 30px 80px rgba(30,25,20,.14);display:none}
#panel.on{display:block}
#panel h2{margin:0 0 4px;font:700 clamp(30px,3.4vw,42px)/1.12 "Reem Kufi",sans-serif;text-wrap:balance}
#panel .meta{color:var(--mute);margin:0 0 14px;font-size:15px}
#panel dl{display:grid;grid-template-columns:auto 1fr;gap:6px 20px;margin:0 0 16px;padding:14px 0;border-block:1px solid var(--line);font-size:15px}
#panel dt{color:var(--mute)}#panel dd{margin:0}
.price{font-size:26px;font-weight:600;margin:0 0 16px;white-space:nowrap;color:var(--gold)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .grow{flex:1}
.x{position:absolute;top:14px;left:14px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:22px;line-height:1}
.count{font-size:13px;color:var(--mute);margin:14px 0 0}

.modal{position:fixed;inset:0;z-index:10;display:none;background:rgba(251,251,249,.95);backdrop-filter:blur(6px);overflow:auto}
.modal.on{display:block}
.mclose{position:sticky;top:12px;float:left;margin:12px;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:22px;line-height:1}
.grid{max-width:1240px;margin:0 auto;padding:30px max(5vw,16px) 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:34px 26px}
.grid h2{grid-column:1/-1;margin:0;font:700 40px/1.1 "Reem Kufi",sans-serif}
.card{background:none;border:0;padding:0;text-align:right}
.card .frame{border:7px solid var(--fc);background:#fff;padding:7%;box-shadow:0 10px 26px rgba(30,25,20,.16);transition:transform .3s}
.card:hover .frame{transform:translateY(-4px)}
.card svg{display:block;width:100%;height:auto}
.card b{display:block;margin-top:12px;font-weight:600}.card small{color:var(--mute);font-size:14px}

@media(max-width:700px){
  #panel{left:10px;right:10px;top:auto;bottom:10px;width:auto;transform:none;padding:18px 18px 16px;max-height:46vh;overflow:auto}
  #panel h2{font-size:28px;padding-left:48px}#panel dl{display:none}.price{font-size:22px;margin-bottom:12px}
  .brand small,#cap small,.note{display:none}.brand img{height:42px}
}
@media(max-width:480px){#bar .btn{padding:0 14px}#bar .btn span{display:none}#cap{font-size:14px;gap:10px}#cap button{line-height:1.3}}
@media(prefers-reduced-motion:reduce){.mouse::after,.cue.nudge{animation:none}.art .frame,.card .frame{transition:none}}
</style>
</head>
<body>
<header>
  <a class="brand" href="#" id="home"><img src="logo-sm.webp" alt="شعار زخرف" width="29" height="50"><span><b>زخرف</b><small>معرض اللوحات</small></span></a>
  <button class="btn" id="allBtn">كل اللوحات</button>
</header>
<p class="note">لوحات وأسعار نموذجية للعرض</p>

<div id="stage"><svg id="corr" width="1" height="1" aria-hidden="true"></svg><div id="world"></div></div>

<section id="hero">
  <img src="logo.webp" alt="زخرف" width="166" height="290">
  <p>معرض لوحات تمشي فيه. كل لوحة على الجدار متاحة للطلب.</p>
  <div class="cue" id="cue">
    <div class="mouse" aria-hidden="true"></div>
    <strong id="cueText">مرّر لأسفل لتمشي في الممر</strong>
    <small>واضغط على أي لوحة لتقترب منها</small>
    <button class="btn dark" id="startBtn">ابدأ الجولة ↓</button>
  </div>
</section>

<div id="toast" role="status">اضغط على أي لوحة لتشاهدها عن قرب</div>
<div id="outro"><button class="btn dark" id="again">ابدأ الجولة من جديد</button><button class="btn" id="all2">شاهد كل اللوحات</button></div>

<div id="bar">
  <button class="btn" id="prev" aria-label="اللوحة السابقة">→ <span>السابق</span></button>
  <div id="cap" aria-live="polite"></div>
  <button class="btn" id="next" aria-label="اللوحة التالية"><span>التالي</span> ←</button>
</div>
<div id="prog"></div>

<aside id="panel" role="dialog" aria-label="تفاصيل اللوحة"></aside>
<div class="modal" id="mAll" role="dialog" aria-modal="true" aria-label="كل اللوحات"><button class="mclose" data-close aria-label="إغلاق">×</button><div class="grid" id="grid"></div></div>

<div id="track"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/ScrollTrigger.min.js"></script>
<script src="https://unpkg.com/lenis@1.3.4/dist/lenis.min.js"></script>
<script>
{
// ===== الإعدادات: ضع رقم واتساب المتجر هنا (بالصيغة الدولية بدون +) =====
const WHATSAPP = '';
const CUR = 'ر.س';

const PAL = {
  saffron:['#fbf3e2','#e3a23b','#b5482f','#2f4858','#f0d9a8'],
  sand:['#efe6d6','#d9b98c','#b9855a','#7a4b32','#2f3a4a'],
  indigo:['#e9ecf2','#2c3e6b','#c9a25a','#8fa3c7','#1a2340'],
  clay:['#f3ebe3','#c96f4a','#e7b98f','#5b3a2e','#2e5b5a'],
  mono:['#f2f1ee','#1d1d1b','#9a968e','#d6d2ca','#5a5750'],
  night:['#1e2433','#c9a25a','#e9e2d0','#4a5a7a','#8a6a3a'],
  sage:['#eef0ea','#3f6f6a','#d8c79a','#a9c0b4','#22312f'],
  rose:['#f6eeee','#c98f8f','#7c4a5a','#e9cfc3','#3b2a33']
};
// [العنوان, الأسلوب, الألوان, عرض/ارتفاع, المقاس, التقنية, السعر, لون البرواز]
const RAW = [
 ['باب الشمس','arches','saffron',.75,'60 × 80 سم','أكريليك على كانفس',1450,'#1d1b19'],
 ['كثبان الربع الخالي','dunes','sand',1.33,'100 × 75 سم','زيت على كانفس',2300,'#a07c52'],
 ['نجمة الأندلس','star','indigo',.75,'60 × 80 سم','أكريليك وورق ذهب',1900,'#1d1b19'],
 ['وردة الظهيرة','rosette','clay',.8,'70 × 87 سم','أكريليك على كانفس',1650,'#f4f1ec'],
 ['سكون','fields','mono',.8,'80 × 100 سم','زيت على كتان',2100,'#1d1b19'],
 ['مدار','orbit','night',.75,'60 × 80 سم','أكريليك على كانفس',1550,'#a07c52'],
 ['قناطر','arches','indigo',.75,'75 × 100 سم','جواش على ورق قطني',1250,'#f4f1ec'],
 ['رمال الفجر','dunes','rose',1.33,'100 × 75 سم','زيت على كانفس',2250,'#1d1b19'],
 ['زليج','star','sage',.75,'60 × 80 سم','أكريليك على خشب',1800,'#a07c52'],
 ['حديقة القمر','rosette','night',.8,'70 × 87 سم','أكريليك وورق ذهب',2400,'#1d1b19'],
 ['طبقات','fields','clay',.8,'80 × 100 سم','زيت على كتان',1950,'#f4f1ec'],
 ['كسوف','orbit','saffron',.75,'60 × 80 سم','أكريليك على كانفس',1350,'#1d1b19'],
 ['محراب','arches','sage',.75,'75 × 100 سم','جواش على ورق قطني',1300,'#a07c52'],
 ['ريح الشمال','dunes','indigo',1.33,'120 × 90 سم','زيت على كانفس',2800,'#1d1b19'],
 ['مشربية','star','rose',.75,'60 × 80 سم','أكريليك وورق ذهب',1850,'#f4f1ec'],
 ['شمسة','rosette','sand',.8,'70 × 87 سم','أكريليك على كانفس',1700,'#1d1b19']
];
const ART = RAW.map((a,i)=>({id:i,title:a[0],style:a[1],c:PAL[a[2]],ratio:a[3],size:a[4],tech:a[5],price:a[6],fc:a[7]}));
// لاستخدام صور حقيقية: أضف ART[i].img = 'رابط الصورة'

// ===== رسم اللوحات (SVG) =====
const rng = s => () => (s = (s*16807) % 2147483647) / 2147483647;
let uid = 0;
const svgArt = (a) => {
  if (a.img) return `<img src="${a.img}" alt="${a.title}" style="width:100%;height:100%;object-fit:cover;display:block">`;
  const W = a.ratio > 1 ? 400 : 300, H = Math.round(W / a.ratio), c = a.c, r0 = rng(a.id*7919+13), r = (x,y)=>x+(y-x)*r0(), id='p'+(uid++);
  let g = `<rect width="${W}" height="${H}" fill="${c[0]}"/>`;
  if (a.style==='arches'){
    g += `<circle cx="${W*r(.3,.7)}" cy="${H*.2}" r="${W*.1}" fill="${c[4]}"/>`;
    for(let i=0;i<5;i++){const w=W*(.74-i*.13),h=H*(.8-i*.12),x=(W-w)/2,yb=H*.92,top=yb-h+w/2;
      g+=`<path d="M${x} ${yb}V${top}A${w/2} ${w/2} 0 0 1 ${x+w} ${top}V${yb}Z" fill="${c[(i%4)+1]}"/>`}
    g += `<rect y="${H*.92}" width="${W}" height="${H*.08}" fill="${c[3]}"/>`;
  } else if (a.style==='dunes'){
    g = `<defs><linearGradient id="${id}" x2="0" y2="1"><stop offset="0" stop-color="${c[0]}"/><stop offset="1" stop-color="${c[4]}" stop-opacity=".35"/></linearGradient></defs><rect width="${W}" height="${H}" fill="url(#${id})"/>`;
    g += `<circle cx="${W*r(.25,.75)}" cy="${H*.33}" r="${H*.13}" fill="${c[2]}" opacity=".9"/>`;
    for(let i=0;i<4;i++){const y=H*(.5+i*.13);
      g+=`<path d="M0 ${y}Q${W*r(.2,.8)} ${y-H*r(.08,.2)} ${W} ${y+H*r(-.06,.04)}V${H}H0Z" fill="${c[[1,2,3,4][i]]}" opacity="${.75+i*.08}"/>`}
  } else if (a.style==='star'){
    const s = W/ Math.round(r(4,6));
    g += `<defs><pattern id="${id}" width="${s}" height="${s}" patternUnits="userSpaceOnUse"><g transform="translate(${s/2} ${s/2})" fill="none" stroke="${c[1]}" stroke-width="${s*.06}"><rect x="${-s*.28}" y="${-s*.28}" width="${s*.56}" height="${s*.56}"/><rect x="${-s*.28}" y="${-s*.28}" width="${s*.56}" height="${s*.56}" transform="rotate(45)"/></g><circle cx="${s/2}" cy="${s/2}" r="${s*.07}" fill="${c[2]}"/></pattern></defs><rect width="${W}" height="${H}" fill="url(#${id})"/>`;
    const R=W*.34,cy=H/2; let st='';
    for(let k=0;k<2;k++) st+=`<rect x="${-R*.62}" y="${-R*.62}" width="${R*1.24}" height="${R*1.24}" transform="rotate(${k*45})"/>`;
    g += `<circle cx="${W/2}" cy="${cy}" r="${R*1.02}" fill="${c[0]}" stroke="${c[2]}" stroke-width="3"/><g transform="translate(${W/2} ${cy})"><g fill="${c[1]}">${st}</g><g fill="${c[3]}" transform="scale(.6) rotate(22.5)">${st}</g><circle r="${R*.18}" fill="${c[2]}"/></g>`;
  } else if (a.style==='rosette'){
    g += `<g transform="translate(${W/2} ${H/2})">`;
    for(let L=0;L<3;L++){const n=8+L*4;for(let k=0;k<n;k++)g+=`<ellipse rx="${W*(.4-L*.11)}" ry="${W*(.07-L*.01)}" transform="rotate(${k*180/n+L*7})" fill="${c[L+1]}" opacity=".78"/>`}
    g += `<circle r="${W*.06}" fill="${c[4]}"/></g>`;
  } else if (a.style==='fields'){
    g += `<defs><filter id="${id}"><feGaussianBlur stdDeviation="2.4"/></filter></defs><g filter="url(#${id})"><rect x="${W*.1}" y="${H*.08}" width="${W*.8}" height="${H*.44}" rx="5" fill="${c[1]}"/><rect x="${W*.1}" y="${H*.56}" width="${W*.8}" height="${H*.36}" rx="5" fill="${c[2]}"/><rect x="${W*.1}" y="${H*.52}" width="${W*.8}" height="${H*.04}" fill="${c[3]}"/></g>`;
  } else {
    const cy=H*.42, x0=W*r(.4,.6);
    for(let i=0;i<6;i++) g+=`<circle cx="${x0+(i%2?1:-1)*i*W*.012}" cy="${cy}" r="${W*(.36-i*.055)}" fill="${c[(i%4)+1]}"/>`;
    g += `<rect y="${H*.8}" width="${W}" height="${H*.2}" fill="${c[3]}"/><rect y="${H*.8}" width="${W}" height="3" fill="${c[1]}"/>`;
  }
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${a.title}">${g}</svg>`;
};
const fmt = n => n.toLocaleString('ar-EG');

// ===== بناء الممر =====
const world = document.getElementById('world'), stage = document.getElementById('stage');
const N = ART.length/2, K = 1.15, D2R = Math.PI/180;
let P,Wd,Hc,G,SEG,start,viewDist,travel,zEnd,ph, items=[];
const place = (el,x,y,z,w,h,rot='') => {el.style.width=w+'px';el.style.height=h+'px';el.style.transform=`translate3d(${x-w/2}px,${y-h/2}px,${z}px) ${rot}`};
function build(){
  const vw=innerWidth, vh=innerHeight;
  Hc = vh*1.03; Wd = Math.max(vw*1.04, 360); P = Math.max(700, vh*.95);
  ph = Math.min(Hc*.4, 430);
  G = Math.max(900, ph*2.6); SEG = 380;
  viewDist = G*.95; start = G*1.15;
  zEnd = -(start + (N-1)*G + G/2 + G*1.3);
  travel = -zEnd - P*1.4;
  if (vw < 700){ FOG0 = 1500; FOG1 = 2200 } else { FOG0 = 2600; FOG1 = 3400 }
  stage.style.setProperty('--p', P+'px'); stage.style.setProperty('--W', Wd+'px');
  world.innerHTML=''; items=[];
  // كل عنصر: موضعه x,z ونصف امتداده على المحورين لحساب الرؤية
  const add = (cls,x,y,z,w,h,rot,hx,hz,html='') => {const e=document.createElement('div');e.className='pl '+cls;e.innerHTML=html;place(e,x,y,z,w,h,rot);world.appendChild(e);items.push({e,x,z,hx,hz});return e};
  for(let z=P*2; z>zEnd-SEG; z-=SEG){
    const zc=z-SEG/2;
    add('wl',-Wd/2,0,zc,SEG+2,Hc,'rotateY(90deg)',0,SEG/2);
    add('wr',Wd/2,0,zc,SEG+2,Hc,'rotateY(-90deg)',0,SEG/2);
    add('bb',-Wd/2+1,Hc/2-Hc*.045,zc,SEG+2,3,'rotateY(90deg)',0,SEG/2);
    add('bb',Wd/2-1,Hc/2-Hc*.045,zc,SEG+2,3,'rotateY(-90deg)',0,SEG/2);
    const n = Math.ceil(Wd/420), tw = Wd/n;   // بلاطات صغيرة عشان الالتفاف يبان سليم
    for(let k=0;k<n;k++){ const x = -Wd/2 + tw*(k+.5);
      add('fl',x,Hc/2,zc,tw+2,SEG+2,'rotateX(90deg)',tw/2,SEG/2);
      add('ce',x,-Hc/2,zc,tw+2,SEG+2,'rotateX(-90deg)',tw/2,SEG/2); }
    add('lt',0,-Hc/2+1,zc,Wd*.1,SEG+2,'rotateX(-90deg)',Wd*.05,SEG/2);
    add('fs',0,Hc/2-1,zc,Wd*.34,SEG+2,'rotateX(90deg)',Wd*.17,SEG/2);
  }
  add('end',0,0,zEnd,Wd,Hc,'',Wd/2,0,'<img src="logo.webp" alt="زخرف"><span>نهاية الممر — كل اللوحات متاحة للطلب</span>');
  ART.forEach((a,i)=>{
    const left = i%2===0, bay = Math.floor(i/2);
    const z = -(start + bay*G + (left?0:G/2));
    const h = a.ratio>1 ? ph*.78 : ph, w = h*a.ratio, x = (left?-1:1)*(Wd/2-8), y = -Hc*.05;
    const e = add('art', x, y, z, w, h, left?'rotateY(90deg)':'rotateY(-90deg)', 0, w/2,
      `<div class="frame" style="--fc:${a.fc}">${svgArt(a)}</div><div class="plaque">${a.title}<small>${a.size} · ${fmt(a.price)} ${CUR}</small></div>`);
    e.tabIndex=0; e.setAttribute('role','button'); e.setAttribute('aria-label','اقترب من لوحة '+a.title);
    e.onclick=ev=>{ev.stopPropagation(); focusOn(i)}; e.onkeydown=ev=>{if(ev.key==='Enter')focusOn(i)};
    Object.assign(a,{x,y,z,w,h,bay,left});
  });
  drawCorridor();
  document.getElementById('track').style.height = (innerHeight + travel*K) + 'px';
}

// الممر ثابت الشكل وانت ماشي، فبيترسم مرة واحدة كخلفية بنفس المنظور
// والحيطان ثلاثية الأبعاد بتظهر بس وقت التفات الكاميرا
function drawCorridor(){
  const S = 5, s1 = P/(P+FOG0), sm = P/(P+FOG0+FOG1/2), s2 = P/(P+FOG0+FOG1), w = Wd/2, h = Hc/2, yb = h - Hc*.045;
  let defs = '', body = '', n = 0;
  const tri = (pts, col, ax, base) => { const id = 'g'+(n++), k = ax==='x' ? ['x1','x2'] : ['y1','y2'];
    defs += `<linearGradient id="${id}" gradientUnits="userSpaceOnUse" ${ax==='x'?'y1="0" y2="0"':'x1="0" x2="0"'} ${k[0]}="${base*s1}" ${k[1]}="${base*s2}"><stop offset="0" stop-color="${col}"/><stop offset="${(s1-sm)/(s1-s2)}" stop-color="${col}" stop-opacity=".5"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient>`;
    body += `<polygon points="${pts.map(p=>p.join(',')).join(' ')}" fill="url(#${id})"/>`; };
  tri([[-w*S,-h*S],[-w*S,h*S],[0,0]], '#f4f3ef','x',-w);
  tri([[w*S,-h*S],[w*S,h*S],[0,0]], '#f8f7f4','x',w);
  tri([[-w*S,h*S],[w*S,h*S],[0,0]], '#e9e7e2','y',h);
  tri([[-w*S,-h*S],[w*S,-h*S],[0,0]], '#f7f6f3','y',-h);
  tri([[-Wd*.17*S,h*S],[Wd*.17*S,h*S],[0,0]], '#efeee9','y',h);
  tri([[-Wd*.05*S,-h*S],[Wd*.05*S,-h*S],[0,0]], '#ffffff','y',-h);
  tri([[-w*S,(yb-1.5)*S],[-w*S,(yb+1.5)*S],[0,0]], '#d6d2ca','x',-w);
  tri([[w*S,(yb-1.5)*S],[w*S,(yb+1.5)*S],[0,0]], '#d6d2ca','x',w);
  document.getElementById('corr').innerHTML = `<defs>${defs}</defs>${body}`;
}

// ===== السكرول والكاميرا =====
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const touch = matchMedia('(pointer: coarse)').matches;
const hasG = !!(window.gsap && window.ScrollTrigger);
let lenis = (window.Lenis && !reduce) ? new Lenis({lerp:.075, wheelMultiplier:.9}) : null;
if (hasG){
  gsap.registerPlugin(ScrollTrigger);
  if (lenis) lenis.on('scroll', ScrollTrigger.update);
  gsap.from('#hero img,#hero p,#cue',{y:40,opacity:0,duration:1.2,stagger:.15,ease:'expo.out',delay:.15});
  gsap.from('#world',{opacity:0,duration:1.6,ease:'power2.out'});
  gsap.to('#hero',{opacity:0,y:-60,ease:'none',scrollTrigger:{trigger:'#track',start:'top top',end:'+=480',scrub:true}});
}
const scrollPos = () => lenis ? lenis.scroll : scrollY;
const camFor = s => Math.min(travel, Math.max(0, s / K));
const setScroll = (cz, now) => { const y = cz*K; lenis ? lenis.scrollTo(y,{immediate:!!now,force:true,duration:1.6}) : scrollTo({top:y,behavior:now||reduce?'auto':'smooth'}) };
const bayCam = b => Math.min(travel, Math.max(0, start + b*G + G/4 - viewDist));
const bayAt = cz => Math.max(0, Math.min(N-1, Math.round((cz + viewDist - start - G/4)/G)));

// V = الكاميرا: x,y موضعها، z إزاحة الممر، yaw التفاتها
const V = {x:0,y:0,z:0,yaw:0};
let lastTf = '', lastWalls = null, corr = document.getElementById('corr'), FOG0 = 2600, FOG1 = 3400, mode = 'walk', current = -1, mx=.5,my=.5,rx=0,ry=0,lastBay=-1;
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth;my=e.clientY/innerHeight});
const cap=document.getElementById('cap'), prog=document.getElementById('prog'), outro=document.getElementById('outro'), hero=document.getElementById('hero'), panel=document.getElementById('panel'), toast=document.getElementById('toast');

function render(t){
  if (lenis) lenis.raf(t);
  if (mode==='walk') V.z = camFor(scrollPos());
  const k = mode==='walk' ? 1 : .35;
  if(!reduce){ rx += ((my-.5)*2.2*k - rx)*.05; ry += ((mx-.5)*-5*k - ry)*.05; }
  const tf = `translateZ(${P}px) rotateX(${rx.toFixed(2)}deg) rotateY(${(V.yaw+ry).toFixed(2)}deg) translateZ(${-P}px) translate3d(${V.x.toFixed(1)*-1}px,${V.y.toFixed(1)*-1}px,${V.z.toFixed(1)}px)`;
  if (tf === lastTf){ requestAnimationFrame(render); return; }
  lastTf = tf; world.style.transform = tf;
  const walls = mode !== 'walk';
  if (walls !== lastWalls){ lastWalls = walls; world.classList.toggle('walls', walls); corr.style.visibility = walls ? 'hidden' : 'visible' }
  if (!walls) corr.style.transform = `translate(${(-P*Math.tan(ry*D2R)).toFixed(1)}px,${(P*Math.tan(rx*D2R)).toFixed(1)}px)`;
  const s = Math.sin(V.yaw*D2R), c = Math.cos(V.yaw*D2R), as=Math.abs(s), ac=Math.abs(c);
  for (const it of items){
    const vx = it.x - V.x, vz = it.z + V.z - P;
    const depth = vx*s - vz*c, ext = as*it.hx + ac*it.hz;   // العمق أمام عين الكاميرا
    if (depth + ext < 2 || depth - ext > P + FOG0 + FOG1){ if(it.v!==0){it.e.style.visibility='hidden';it.v=0} continue; }
    if(it.v!==1){it.e.style.visibility='visible';it.v=1}
    const d = depth - P, o = d < FOG0 ? 1 : Math.max(0, +(1-(d-FOG0)/FOG1).toFixed(2));
    if (it.o!==o){ it.e.style.opacity = o; it.o=o }
  }
  const p = V.z/travel;
  prog.style.transform = `scaleX(${Math.min(1,Math.max(0,p))})`;
  outro.classList.toggle('on', mode==='walk' && p > .97);
  if (!hasG) hero.style.opacity = Math.max(0, 1 - scrollPos()/480);
  if (mode==='walk'){
    const b = p > .97 ? -2 : bayAt(V.z);
    if (b !== lastBay){ lastBay = b; drawCap(b); }
    if (!toastShown && scrollPos() > 500){ toastShown = true; showToast() }
  }
  requestAnimationFrame(render);
}
let toastShown = false;
function showToast(){ toast.classList.add('on'); setTimeout(()=>toast.classList.remove('on'), 4200) }
function drawCap(b){
  if (b<0){ cap.innerHTML='<button data-all>وصلت لنهاية المعرض<small>شاهد كل اللوحات</small></button>'; return; }
  const L=ART[b*2], R=ART[b*2+1];
  cap.innerHTML = `<button data-i="${R.id}">${R.title} ←<small>على يمينك · ${fmt(R.price)} ${CUR}</small></button><button data-i="${L.id}">→ ${L.title}<small>على يسارك · ${fmt(L.price)} ${CUR}</small></button>`;
}

// ===== الكاميرا تلتفت للوحة =====
let tw = null;
function moveCam(target, dur, done){
  tw && tw.kill();
  if (hasG && !reduce) tw = gsap.to(V,{...target,duration:dur,ease:'power3.inOut',onComplete:done});
  else { Object.assign(V,target); done && done() }
}
function focusTarget(a){
  const vw=innerWidth, vh=innerHeight, narrow = vw < 700;
  const side = a.left ? 1 : -1;
  let D = a.h*P/(vh*(narrow?.4:.6));
  D = Math.max(D, a.w*P/(vw*(narrow?.82:.46)));
  const sx = narrow ? 0 : vw*.17, ty = narrow ? -vh*.2 : -vh*.02;
  const eyeZ = a.z + side*sx*D/P;
  return { x: a.x + side*D, y: a.y - ty*D/P, z: P - eyeZ, yaw: a.left ? -90 : 90 };
}
function focusOn(i){
  const a = ART[i]; if(!a) return;
  if (mAll.classList.contains('on')) closeGrid(true);
  const was = mode; mode = 'focus'; current = i;
  lenis && lenis.stop(); document.body.classList.add('focus');
  panel.classList.remove('on');
  const T = focusTarget(a), dist = Math.abs(T.z - V.z) + Math.abs(T.x - V.x);
  moveCam(T, Math.min(2.6, (was==='focus'?1.1:1.3) + dist/7000), ()=>showPanel(i));
}
function showPanel(i){
  const a = ART[i], msg = encodeURIComponent(`مرحباً زخرف، أريد طلب لوحة «${a.title}» (${a.size}).`);
  panel.innerHTML = `<button class="x" id="pClose" aria-label="رجوع للممر">×</button>
    <h2>${a.title}</h2><p class="meta">مجموعة زخرف · قطعة أصلية واحدة</p>
    <dl><dt>المقاس</dt><dd>${a.size}</dd><dt>التقنية</dt><dd>${a.tech}</dd><dt>البرواز</dt><dd>خشب طبيعي مع ماونت أبيض</dd><dt>التوصيل</dt><dd>مغلّفة وجاهزة للتعليق</dd></dl>
    <p class="price">${fmt(a.price)} ${CUR}</p>
    <div class="row"><a class="btn dark grow" href="https://wa.me/${WHATSAPP}?text=${msg}" target="_blank" rel="noopener">اطلب عبر واتساب</a></div>
    <div class="row" style="margin-top:8px"><button class="btn grow" id="pPrev" ${i===0?'disabled':''}>→ السابقة</button><button class="btn grow" id="pNext" ${i===ART.length-1?'disabled':''}>التالية ←</button></div>
    <p class="count">اللوحة ${fmt(i+1)} من ${fmt(ART.length)} · ${touch?'اسحب أو اضغط × للرجوع':'اضغط Esc أو مرّر للرجوع'}</p>`;
  panel.classList.add('on');
  hasG && !reduce && gsap.fromTo(panel.children,{opacity:0,y:16},{opacity:1,y:0,duration:.5,stagger:.04,ease:'power2.out'});
  document.getElementById('pClose').onclick=unfocus;
  document.getElementById('pPrev').onclick=()=>focusOn(i-1);
  document.getElementById('pNext').onclick=()=>focusOn(i+1);
  document.getElementById('pClose').focus({preventScroll:true});
}
function unfocus(){
  if (mode!=='focus') return;
  const a = ART[current], cz = bayCam(a.bay);
  panel.classList.remove('on'); mode = 'back';
  setScroll(cz, true);
  moveCam({x:0,y:0,z:cz,yaw:0}, 1.3, ()=>{ mode='walk'; lenis && lenis.start(); document.body.classList.remove('focus'); lastBay=-1 });
}
stage.addEventListener('click',()=>{ if(mode==='focus') unfocus() });
addEventListener('wheel',e=>{ if(mode==='focus' && Math.abs(e.deltaY)>25 && !panel.contains(e.target)) unfocus() },{passive:true});
let ty0=0; addEventListener('touchstart',e=>{ty0=e.touches[0].clientY},{passive:true});
addEventListener('touchmove',e=>{ if(mode==='focus' && !panel.contains(e.target) && Math.abs(e.touches[0].clientY-ty0)>40) unfocus() },{passive:true});
addEventListener('keydown',e=>{
  if (e.key==='Escape'){ mAll.classList.contains('on') ? closeGrid() : unfocus() }
  if (mode==='focus' && e.key==='ArrowLeft' && current<ART.length-1) focusOn(current+1);
  if (mode==='focus' && e.key==='ArrowRight' && current>0) focusOn(current-1);
});

// ===== التنقل =====
cap.onclick = e => { const btn=e.target.closest('button'); if(!btn) return; btn.dataset.all!==undefined ? openGrid() : focusOn(+btn.dataset.i) };
document.getElementById('next').onclick=()=>{const z=camFor(scrollPos()), b=bayAt(z); z < bayCam(0)-50 ? setScroll(bayCam(0)) : b>=N-1 ? setScroll(travel) : setScroll(bayCam(b+1))};
document.getElementById('prev').onclick=()=>{const b=bayAt(camFor(scrollPos())); lastBay===-2 ? setScroll(bayCam(N-1)) : b<=0 ? setScroll(0) : setScroll(bayCam(b-1))};
document.getElementById('startBtn').onclick=()=>setScroll(bayCam(0));
document.getElementById('again').onclick=()=>setScroll(0);
document.getElementById('home').onclick=e=>{e.preventDefault(); mode==='focus' ? unfocus() : setScroll(0)};
if (touch){ document.getElementById('cue').classList.add('touch'); document.getElementById('cueText').textContent='اسحب لأعلى لتمشي في الممر' }
setTimeout(()=>{ if(scrollPos()<20 && mode==='walk') document.getElementById('cue').classList.add('nudge') }, 3500);

// ===== كل اللوحات =====
const mAll=document.getElementById('mAll');
function openGrid(){
  document.getElementById('grid').innerHTML = '<h2>كل اللوحات</h2>' + ART.map(a=>`<button class="card" data-i="${a.id}"><div class="frame" style="--fc:${a.fc}">${svgArt(a)}</div><b>${a.title}</b><small>${a.size} · ${fmt(a.price)} ${CUR}</small></button>`).join('');
  mAll.classList.add('on'); mAll.scrollTop=0; lenis && lenis.stop(); mAll.querySelector('.mclose').focus();
  hasG && gsap.fromTo('#grid',{opacity:0,y:30},{opacity:1,y:0,duration:.6,ease:'expo.out'});
}
function closeGrid(keep){ mAll.classList.remove('on'); if(!keep && mode==='walk') lenis && lenis.start() }
mAll.querySelector('[data-close]').onclick=()=>closeGrid();
document.getElementById('grid').onclick=e=>{const c=e.target.closest('.card'); if(c) focusOn(+c.dataset.i)};
document.getElementById('allBtn').onclick=openGrid;
document.getElementById('all2').onclick=openGrid;

let rt; addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>{const p=camFor(scrollPos())/travel;build();items.forEach(it=>{it.v=it.o=undefined});lastTf='';setScroll(p*travel,true);lastBay=-1;if(mode==='focus'){Object.assign(V,focusTarget(ART[current]))}},200)});
build();
requestAnimationFrame(render);
}
</script>
</body>
</html>
